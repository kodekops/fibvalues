services:
  worker:
    image: kodega2016/fib-worker:latest
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
  api:
    image: kodega2016/fib-server:latest
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - POSTGRES_HOST=$POSTGRES_HOST
      - POSTGRES_PORT=$POSTGRES_PORT
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DATABASE=$POSTGRES_DB
  client:
    image: kodega2016/fib-client:latest
    mem_limit: 128m
    hostname: client
    depends_on:
      - api
  nginx:
    image: kodega2016/fib-nginx:latest
    mem_limit: 128m
    hostname: nginx
    ports:
      - 80:80
    depends_on:
      - api
      - client