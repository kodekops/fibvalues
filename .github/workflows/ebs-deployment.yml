name: EBS deployment
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: login to docker hub
        run: echo "${{secrets.DOCKER_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin

      - name: unit testing
        run: |
          docker image build ./client -t kodega2016/react-app:dev -f ./client/Dockerfile.dev
          docker container run -e CI=true kodega2016/react-app:dev npm run test

      - name: build docker image
        run: |
          docker image build ./client -t kodega2016/fib-client:latest
          docker image build ./api -t kodega2016/fib-server:latest
          docker image build ./worker -t kodega2016/fib-worker:latest
          docker image build ./nginx -t kodega2016/fib-nginx:latest

      - name: push docker image
        run: |
          docker push kodega2016/fib-client:latest
          docker push kodega2016/fib-server:latest
          docker push kodega2016/fib-worker:latest
          docker push kodega2016/fib-nginx:latest
      
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: deploy.zip
          existing_bucket_name: elasticbeanstalk-us-east-1-577638379967
          use_existing_version_if_available: true